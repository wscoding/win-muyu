name: prue_widgets
description: "Prue Widgets — 电子木鱼桌面小部件（Windows / macOS）。"
publish_to: 'none'

# build-name / build-number 由 `flutter build --build-name --build-number` 覆盖
version: 3.0.2+302

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # ---- 状态管理 ----
  flutter_riverpod: ^3.3.2

  # ---- 桌面窗口 / 系统集成 ----
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  # 注意：0.6.x 已被 pub 撤回（retracted），此约束不可放宽到 ^0.6.0
  tray_manager: ^0.5.3
  hotkey_manager: ^0.2.3
  # 仅 Windows 生效；macOS 的单实例由原生 Swift 代码实现
  # 注意：本包依赖 win32 ^6，与依赖 win32_registry(→win32 ^5) 的 launch_at_startup 互斥
  windows_single_instance: ^1.2.0

  # ---- UI ----
  flutter_screenutil: ^5.9.3

  # ---- 媒体 ----
  audioplayers: ^6.7.0
  file_picker: ^13.1.0

  # ---- 存储 / 网络 / 工具 ----
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  http: ^1.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/tray/